name: Validate usage-limit recovery integration

on:
  push:
    branches: [work/issue-32286-validation]
    paths: [.github/workflows/issue-32286-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'saiananth1/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: 4428526edbd10300acb74efe75e5586da1cf29fa
      PR_BASE: 38e7eec391ff400e2b268a6da68a78308fa5ff4a
    steps:
      - name: Check out pinned public candidate without storing credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/saiananth1/t3code.git
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --depth=1 origin "$EXPECTED_HEAD" "$PR_BASE"
          git config core.sparseCheckout true
          printf '/*\n!/.repos/\n!/apps/mobile/modules/t3-terminal/Vendor/**/*.a\n' > .git/info/sparse-checkout
          git -c advice.detachedHead=false checkout --detach "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/recovery-evidence"

      - name: Extend existing scenario table with notification and user-stop guards
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/recovery-evidence/guards.patch"
          git apply --check "$RUNNER_TEMP/recovery-evidence/guards.patch"
          git apply "$RUNNER_TEMP/recovery-evidence/guards.patch"
          git diff --check

      - name: Install repository toolchain
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: 'false'

      - name: Format and commit focused guard tests
        run: |
          set -euo pipefail
          vp fmt apps/server/src/orchestration-v2/runtimeLayer.test.ts
          git diff --check
          git config user.name saiananth1
          git config user.email 14952230+saiananth1@users.noreply.github.com
          git add apps/server/src/orchestration-v2/runtimeLayer.test.ts
          git commit -m 'test(server): guard notification recovery across arming and stop' \
            -m 'Extend the existing recovery matrix without disabling assertions: notifications before and after arming, Stop before and after arming, explicit rearm and idempotent continuation.' \
            -m 'Assisted by GPT-6 Astra Pro via ChatGPT.'
          git diff "$PR_BASE" HEAD > "$RUNNER_TEMP/recovery-evidence/candidate.patch"

      - name: Prove all four notification regressions fail without the production fix
        working-directory: apps/server
        run: |
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          mapfile -t production_files < <(git diff --name-only "$PR_BASE" "$EXPECTED_HEAD")
          for file in "${production_files[@]}"; do git show "$PR_BASE:$file" > "$root/$file"; done
          set +e
          vp test run src/orchestration-v2/runtimeLayer.test.ts -t 'guards a scheduled usage-limit continuation against (wake-after-arm|wake-before-arm|stop-after-arm-wake|stop-before-arm-wake)$' > "$RUNNER_TEMP/recovery-evidence/baseline-regressions.log" 2>&1
          result=$?
          set -e
          git -C "$root" restore --worktree --source=HEAD -- "${production_files[@]}"
          cat "$RUNNER_TEMP/recovery-evidence/baseline-regressions.log"
          test "$result" -ne 0
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path(os.environ['RUNNER_TEMP'], 'recovery-evidence/baseline-regressions.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          assert re.search(r'Tests\s+4 failed', text), 'Expected four failing regression cases'
          assert 'AssertionError' in text, 'Expected behavior assertions, not an import or setup error'
          PY
          git diff --exit-code

      - name: Run server recovery and bounded snapshot regressions
        working-directory: apps/server
        run: |
          set -euo pipefail
          vp test run src/orchestration-v2/runtimeLayer.test.ts src/orchestration-v2/ProjectionStore.test.ts src/orchestration-v2/threadHistoryPaging.test.ts src/orchestration-v2/UsageLimitRecoveryWorker.test.ts 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/server-tests.log"

      - name: Run client Resume regressions
        working-directory: packages/client-runtime
        run: |
          set -euo pipefail
          vp test run src/state/threadExecution.test.ts 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/client-tests.log"

      - name: Prepare desktop dependency for changed-package checks
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Run changed-file verification
        run: |
          set -euo pipefail
          vp run check:changed "$PR_BASE" --concurrency 1 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/check-changed.log"
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-evidence/candidate-sha.txt"

      - name: Publish validated candidate to separate fork branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = saiananth1/t3code
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push \
            https://github.com/saiananth1/t3code.git HEAD:refs/heads/work/issue-32286-validated-guards
          echo "Candidate published; upstream PR branch has NOT been modified." >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/recovery-evidence/candidate-sha.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture scoped diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          git status --short > "$RUNNER_TEMP/recovery-evidence/status.txt"
          git diff > "$RUNNER_TEMP/recovery-evidence/working.diff"
          git diff --cached > "$RUNNER_TEMP/recovery-evidence/index.diff"
          tar -czf "$RUNNER_TEMP/recovery-evidence/recovery-sources.tar.gz" \
            apps/server/src/orchestration-v2/Orchestrator.ts \
            apps/server/src/orchestration-v2/ProjectionStore.ts \
            apps/server/src/orchestration-v2/ProjectionStore.test.ts \
            apps/server/src/orchestration-v2/runtimeLayer.test.ts \
            apps/server/src/orchestration-v2/threadHistoryPaging.ts \
            apps/server/src/orchestration-v2/threadHistoryPaging.test.ts \
            packages/client-runtime/src/state/threadExecution.ts \
            packages/client-runtime/src/state/threadExecution.test.ts \
            packages/shared/src/orchestrationV2ThreadError.ts

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-integration-evidence
          path: ${{ runner.temp }}/recovery-evidence
          retention-days: 7
